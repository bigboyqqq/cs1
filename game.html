<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>非正常人类中心 - 合成大帅逼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1020; user-select: none;
  }

  /* ===== 背景：弥散光斑 ===== */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(160deg, #1a1b3a 0%, #12132b 50%, #0d0e1f 100%);
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: .55;
    animation: float 18s ease-in-out infinite;
  }
  .b1 { width: 460px; height: 460px; background: #6c5ce7; top: -120px; left: -100px; }
  .b2 { width: 400px; height: 400px; background: #00cec9; bottom: -140px; right: -80px; animation-delay: -6s; }
  .b3 { width: 340px; height: 340px; background: #fd79a8; top: 40%; left: 55%; animation-delay: -12s; }
  .b4 { width: 300px; height: 300px; background: #fdcb6e; bottom: 10%; left: 10%; animation-delay: -3s; opacity: .35; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px,-50px) scale(1.12); }
    66% { transform: translate(-35px,35px) scale(.92); }
  }

  /* ===== 通用毛玻璃 ===== */
  .glass {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  }

  /* ===== 主界面 ===== */
  #menu {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 42px; padding: 24px;
    transition: opacity .5s ease, transform .5s ease;
  }
  #menu.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }

  .menu-title {
    text-align: center; line-height: 1.35;
    font-size: clamp(28px, 7vw, 52px); font-weight: 800;
    color: #fff; letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(108,92,231,.8), 0 0 60px rgba(253,121,168,.35);
    animation: titleIn .9s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .menu-title .sub {
    display: block; margin-top: 14px;
    font-size: clamp(20px, 5vw, 34px);
    background: linear-gradient(90deg,#6c5ce7,#00cec9,#fd79a8,#fdcb6e);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  @keyframes titleIn { from { opacity:0; transform: translateY(30px) scale(.9); } }

  .btn {
    cursor: pointer; border: none; outline: none;
    padding: 18px 62px; border-radius: 999px;
    font-size: clamp(18px,4.5vw,24px); font-weight: 700; letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(135deg,#6c5ce7,#a55eea 50%,#fd79a8);
    box-shadow: 0 10px 40px rgba(108,92,231,.6), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .18s ease, box-shadow .18s ease;
    animation: titleIn 1s .15s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .btn:active { transform: scale(.94); box-shadow: 0 4px 18px rgba(108,92,231,.5); }

  .menu-hint {
    color: rgba(255,255,255,.5); font-size: 14px; letter-spacing: 1px;
    animation: titleIn 1.1s .3s both;
  }

  /* ===== 游戏容器 ===== */
  #game {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
  }
  #game.show { display: flex; }

  /* 顶部 HUD */
  #hud {
    width: 100%; max-width: 560px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 10px; z-index: 12;
  }
  .hud-card {
    border-radius: 18px; padding: 8px 16px;
    color: #fff; text-align: center; min-width: 92px;
  }
  .hud-label { font-size: 11px; letter-spacing: 2px; opacity: .65; }
  .hud-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hud-score .hud-value { color: #fdcb6e; }
  .hud-best  .hud-value { color: #00cec9; }

  /* 下一个预览 */
  #nextBox {
    display: flex; align-items: center; gap: 10px;
    border-radius: 18px; padding: 8px 14px; color:#fff;
  }
  #nextBox .hud-label { font-size: 11px; letter-spacing: 1px; }
  #nextCanvas {
    width: 46px; height: 46px; border-radius: 12px;
    background: rgba(0,0,0,.2);
  }

  /* 画布区 */
  #stageWrap {
    position: relative; flex: 1; width: 100%;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 0 12px 12px;
  }
  #stage {
    position: relative;
    border-radius: 26px;
    overflow: hidden;
    touch-action: none;
  }
  #stage canvas { display: block; }

  /* ===== 悬浮按钮（暂停 / 声音） ===== */
  #floatBtns {
    position: fixed;
    right: 16px;
    top: calc(env(safe-area-inset-top) + 90px);
    z-index: 25;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .iconBtn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.10);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition: transform .15s ease, background .2s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .iconBtn:active { transform: scale(.9); background: rgba(255,255,255,.2); }
  .iconBtn.off { opacity: .45; }

  /* ===== 解锁横幅 ===== */
  #unlockBanner {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 90px);
    left: 50%;
    transform: translate(-50%, -150%);
    padding: 10px 26px;
    border-radius: 999px;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 2px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .45s cubic-bezier(.2,.9,.3,1.4), opacity .3s;
    white-space: nowrap;
  }
  #unlockBanner.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  /* ===== 里程碑 CG ===== */
  #cg {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(5,5,20,.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #cg.show { display: flex; }
  #cgInner {
    text-align: center;
    animation: cgPop .55s cubic-bezier(.2,.9,.3,1.5) both;
  }
  #cgBall {
    width: min(46vw, 220px); height: min(46vw, 220px);
    border-radius: 50%; margin: 0 auto 26px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; text-align: center; line-height: 1.15;
    padding: 14px;
    animation: cgPulse 1.1s ease-in-out infinite;
  }
  #cgText {
    font-size: clamp(22px,6vw,40px); font-weight: 900; letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 30px rgba(253,121,168,.9), 0 0 60px rgba(108,92,231,.8);
  }
  #cgSub { margin-top: 10px; color: rgba(255,255,255,.7); letter-spacing: 4px; font-size: 14px; }
  @keyframes cgPop { from { opacity:0; transform: scale(.5) rotate(-8deg); } }
  @keyframes cgPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ===== 暂停界面 ===== */
  #pauseOverlay {
    position: fixed; inset: 0; z-index: 55;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(5,5,20,.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #pauseOverlay.show { display: flex; }
  #pauseOverlay h2 {
    color: #fff; font-size: clamp(30px,8vw,48px); letter-spacing: 6px;
    text-shadow: 0 4px 30px rgba(108,92,231,.8);
    animation: cgPop .4s cubic-bezier(.2,.9,.3,1.4) both;
  }
  #pauseOverlay .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #pauseOverlay .btn { padding: 14px 42px; font-size: 17px; }
  #pauseOverlay .btn.ghost {
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: none;
  }

  /* ===== 结束界面 ===== */
  #over {
    position: fixed; inset: 0; z-index: 60;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; padding: 24px;
    background: rgba(5,5,20,.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #over.show { display: flex; }
  #overCard {
    border-radius: 30px; padding: 42px 44px; text-align: center;
    animation: cgPop .5s cubic-bezier(.2,.9,.3,1.4) both;
    max-width: 90vw;
  }
  #overCard h2 { color:#fff; font-size: clamp(24px,6vw,36px); letter-spacing:3px; margin-bottom: 22px; }
  .over-row { display:flex; justify-content: space-between; gap: 40px; margin: 12px 0; color:#fff; }
  .over-row span:first-child { opacity:.6; font-size: 15px; }
  .over-row span:last-child { font-weight: 800; font-size: 20px; color:#fdcb6e; font-variant-numeric: tabular-nums; }
  #overCard .btn { margin-top: 28px; padding: 14px 46px; font-size: 18px; }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<!-- 主界面 -->
<div id="menu">
  <div class="menu-title">
    欢迎来到非正常人类中心
    <span class="sub">合成大帅逼</span>
  </div>
  <button class="btn" id="startBtn">开 始 游 戏</button>
  <div class="menu-hint">拖动选位置 · 松手掉落 · 同类合并进化</div>
</div>

<!-- 游戏 -->
<div id="game">
  <div id="hud">
    <div class="hud-card glass hud-score">
      <div class="hud-label">分数</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div id="nextBox" class="glass">
      <div>
        <div class="hud-label">下一个</div>
      </div>
      <canvas id="nextCanvas" width="92" height="92"></canvas>
    </div>
    <div class="hud-card glass hud-best">
      <div class="hud-label">最高分</div>
      <div class="hud-value" id="bestVal">0</div>
    </div>
  </div>
  <div id="stageWrap">
    <div id="stage" class="glass"></div>
  </div>
</div>

<!-- 悬浮按钮 -->
<div id="floatBtns" style="display:none;">
  <button class="iconBtn" id="pauseBtn" title="暂停">⏸</button>
  <button class="iconBtn" id="soundBtn" title="声音开关">🔊</button>
</div>

<!-- 解锁横幅 -->
<div id="unlockBanner"></div>

<!-- 里程碑 CG -->
<div id="cg">
  <div id="cgInner">
    <div id="cgBall">帅逼</div>
    <div id="cgText">解锁新物种！</div>
    <div id="cgSub">MILESTONE UNLOCKED</div>
  </div>
</div>

<!-- 暂停界面 -->
<div id="pauseOverlay">
  <h2>已 暂 停</h2>
  <div class="row">
    <button class="btn ghost" id="resumeBtn">继 续</button>
    <button class="btn" id="restartBtn">重新开始</button>
  </div>
</div>

<!-- 结束 -->
<div id="over">
  <div id="overCard" class="glass">
    <h2>非正常通道已关闭</h2>
    <div class="over-row"><span>本局分数</span><span id="overScore">0</span></div>
    <div class="over-row"><span>历史最高</span><span id="overBest">0</span></div>
    <button class="btn" id="againBtn">再 来 一 局</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* =====================================================================
   非正常人类中心 · 合成大帅逼  v2
   修复：警戒线误判 / 球消失 / 颜色区分 / 暂停 / 声音开关 / 物理手感
   ===================================================================== */

/* ---------- 1. 角色配置（9 级，颜色彩虹区分） ---------- */
const LEVELS = [
  { name: '鱼蛋',           r: 26,  color: '#FF6B6B', text: '#fff',  fs: 15, dark: false },
  { name: '小黄鱼',         r: 36,  color: '#FFA94D', text: '#fff',  fs: 15, dark: false },
  { name: '大黄鱼',         r: 47,  color: '#FFD43B', text: '#5c3d00', fs: 16, dark: true  },
  { name: '小帅逼',         r: 59,  color: '#69DB7C', text: '#0a4d1a', fs: 17, dark: true  },
  { name: '大帅逼',         r: 72,  color: '#38D9A9', text: '#05453a', fs: 19, dark: true  },
  { name: '肯德基',         r: 86,  color: '#4DABF7', text: '#fff',  fs: 20, dark: false },
  { name: '古巨基',         r: 101, color: '#9775FA', text: '#fff',  fs: 21, dark: false },
  { name: '奥斯特洛夫斯基', r: 118, color: '#F06595', text: '#fff',  fs: 15, dark: false },
  { name: '方块鱼',         r: 136, color: '#FFD700', text: '#5c3d00', fs: 24, dark: true  },
];
const MAX_LEVEL = LEVELS.length - 1;
const SPAWN_MAX = 2;                       // 只随机生成 Lv1~Lv3（索引 0~2）
const SCORE_TABLE = LEVELS.map((_, i) => (i + 1) * 2);

/* ---------- 2. 全局变量 ---------- */
const stageEl   = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');

let W = 380, H = 600;
let WALL = 14;
const DANGER_H = 96;
const DANGER_HOLD = 1600;
const SPAWN_PROTECT = 2000;                // 新球 2 秒内不计入警戒线

let engine, world;
let canvas, ctx;
let balls = [];
let score = 0;
let best  = +(localStorage.getItem('dashuaibi_best') || 0);
let unlocked = new Set();
let gameOver = false;
let paused = false;
let soundOn = true;

let dropX = 0;
let nextLevel = 0;
let canDrop = true;
let dangerTimer = 0;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

/* ---------- 3. 音效 ---------- */
const AudioFX = (() => {
  let ac = null;
  function ctxOn() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, gain, delay, slideTo) {
    if (!soundOn) return;
    type = type || 'sine'; gain = gain || .18; delay = delay || 0;
    const c = ctxOn();
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g   = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + .05);
  }
  return {
    init: ctxOn,
    hit(strength) {
      const v = Math.min(1, Math.max(.15, strength || .5));
      tone(150 * (0.8 + v * .5), 0.16, 'sine', 0.06 + v * 0.12, 0, 70);
      tone(90, 0.10, 'triangle', 0.05 + v * 0.06);
    },
    merge(level) {
      const base = 420 + level * 55;
      tone(base, 0.12, 'sine', 0.2, 0, base * 1.7);
      tone(base * 1.5, 0.16, 'sine', 0.14, 0.05, base * 2.2);
    },
    unlock() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.7, 'triangle', 0.16, i * 0.09));
      tone(261.63, 1.0, 'sine', 0.1, 0);
    },
    unlockSmall() {
      tone(880, 0.14, 'sine', 0.16, 0, 1320);
      tone(1320, 0.2, 'sine', 0.12, 0.08, 1760);
    },
    gameover() {
      [392, 349.23, 293.66, 220].forEach((f, i) => tone(f, 0.45, 'sine', 0.16, i * 0.16));
    }
  };
})();

/* ---------- 4. 物理引擎 ---------- */
const { Engine, Render, Runner, Bodies, Body, Composite, Events } = Matter;

function setupWorld() {
  engine = Engine.create({
    enableSleeping: true,
    positionIterations: 8,     // 更精确的碰撞位置解算
    velocityIterations: 6,
    constraintIterations: 2,
  });
  world = engine.world;
  engine.gravity.y = 1.0;      // 回归标准重力（配合更低的摩擦更顺滑）

  rebuildWalls();
}

function rebuildWalls() {
  if (!world) return;
  Composite.allBodies(world).filter(b => b.label === 'wall').forEach(b => Composite.remove(world, b));
  Composite.add(world, [
    Bodies.rectangle(W / 2, H + WALL / 2, W + WALL * 2, WALL, { isStatic: true, label: 'wall' }),
    Bodies.rectangle(-WALL / 2, H / 2, WALL, H * 2,      { isStatic: true, label: 'wall' }),
    Bodies.rectangle(W + WALL / 2, H / 2, WALL, H * 2,   { isStatic: true, label: 'wall' }),
  ]);
}

/* ---------- 5. 尺寸自适应 ---------- */
function resize() {
  const wrapW = stageWrap.clientWidth  - 24;
  const wrapH = stageWrap.clientHeight - 12;

  const targetRatio = 380 / 600;
  let w = wrapW, h = w / targetRatio;
  if (h > wrapH) { h = wrapH; w = h * targetRatio; }

  W = Math.round(w);
  H = Math.round(h);
  WALL = Math.max(10, Math.round(W * 0.035));

  stageEl.style.width  = W + 'px';
  stageEl.style.height = H + 'px';

  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (engine) rebuildWalls();
  dropX = clamp(dropX || W / 2, 40, W - 40);
  draw();
}

/* ---------- 6. 球创建 ---------- */
function makeBall(level, x, y) {
  const cfg = LEVELS[level];
  const scale = W / 380;
  const r = cfg.r * scale;

  const body = Bodies.circle(x, y, r, {
    restitution: 0.16,        // 轻微弹性
    friction: 0.08,           // 低摩擦，滚动顺滑
    frictionStatic: 0.35,
    frictionAir: 0.006,       // 低空气阻力，下落更自然
    density: 0.0011 + level * 0.00003,
    label: 'ball',
    slop: 0.01,
  });
  body.plugin = { level, r, spawnAt: performance.now() };
  Composite.add(world, body);
  const ball = { body, level, r };
  balls.push(ball);
  return ball;
}

function randomLevel() { return Math.floor(Math.random() * (SPAWN_MAX + 1)); }

/* ---------- 7. 渲染 ---------- */
function lighten(hex, amt) { return shift(hex, amt); }
function darken(hex, amt)  { return shift(hex, -amt); }
function shift(hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  let r = (num >> 16) + amt, g = ((num >> 8) & 0xff) + amt, b = (num & 0xff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function drawBall(b) {
  const cfg = LEVELS[b.level];
  const r = b.r;
  const p = b.body.position;
  const ang = b.body.angle;

  // 阴影
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y + 3, r * 0.95, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.filter = 'blur(6px)';
  ctx.fill();
  ctx.restore();

  // 球体
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  const g = ctx.createRadialGradient(-r * .35, -r * .38, r * .1, 0, 0, r);
  g.addColorStop(0, lighten(cfg.color, 45));
  g.addColorStop(.55, cfg.color);
  g.addColorStop(1, darken(cfg.color, 25));
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // 高光
  ctx.beginPath();
  ctx.ellipse(-r * .33, -r * .40, r * .30, r * .20, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.fill();
  ctx.restore();

  // 文字（水平）
  ctx.save();
  ctx.translate(p.x, p.y);
  const scale = W / 380;
  const fs = cfg.fs * scale;
  ctx.font = `800 ${fs}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = cfg.text;
  ctx.shadowColor = 'rgba(0,0,0,.22)';
  ctx.shadowBlur = 3;

  if (cfg.name.length > 4) {
    const mid = Math.ceil(cfg.name.length / 2);
    ctx.fillText(cfg.name.slice(0, mid), 0, -fs * 0.55);
    ctx.fillText(cfg.name.slice(mid),     0,  fs * 0.55);
  } else {
    ctx.fillText(cfg.name, 0, 1);
  }
  ctx.restore();
}

function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);

  // 警戒线
  const dy = DANGER_H * (H / 600);
  const grad = ctx.createLinearGradient(0, dy - 14, 0, dy + 6);
  grad.addColorStop(0, 'rgba(255,80,80,0)');
  grad.addColorStop(1, 'rgba(255,80,80,.10)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, dy - 14, W, 20);

  ctx.save();
  ctx.setLineDash([9, 8]);
  ctx.strokeStyle = dangerTimer > 0 ? 'rgba(255,90,90,.9)' : 'rgba(255,120,120,.42)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, dy);
  ctx.lineTo(W, dy);
  ctx.stroke();
  ctx.restore();

  // 球
  balls.forEach(drawBall);

  // 瞄准线 + 待落球
  if (canDrop && !gameOver && !paused) {
    const cfg = LEVELS[nextLevel];
    const scale = W / 380;
    const r = cfg.r * scale;
    const x = dropX, y = r + 6;

    ctx.save();
    ctx.setLineDash([8, 10]);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x, H);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = .92;
    const g = ctx.createRadialGradient(x - r * .35, y - r * .38, r * .1, x, y, r);
    g.addColorStop(0, lighten(cfg.color, 45));
    g.addColorStop(1, cfg.color);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const fs = cfg.fs * scale;
    ctx.font = `800 ${fs}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = cfg.text;
    ctx.fillText(cfg.name.length > 4 ? '?' : cfg.name, x, y + 1);
    ctx.restore();
  }
}

/* ---------- 8. 碰撞 & 合成 ---------- */
let mergeLock = new Set();

function onCollision(evt) {
  if (paused || gameOver) return;
  for (const pair of evt.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a.label !== 'ball' || b.label !== 'ball') {
      const ball = a.label === 'ball' ? a : (b.label === 'ball' ? b : null);
      if (ball && performance.now() - ball.plugin.spawnAt > 120) {
        const spd = ball.speed;
        if (spd > 1.4 && Math.random() < .55) AudioFX.hit(Math.min(1, spd / 9));
      }
      continue;
    }
    if (a.plugin.level !== b.plugin.level) continue;
    if (a.plugin.level >= MAX_LEVEL) continue;
    if (mergeLock.has(a.id) || mergeLock.has(b.id)) continue;

    mergeLock.add(a.id); mergeLock.add(b.id);
    doMerge(a, b);
  }
}

function doMerge(a, b) {
  const level = a.plugin.level;
  const newLevel = level + 1;
  const mid = { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };

  removeBall(a);
  removeBall(b);

  // 新球生成在合并点
  const nb = makeBall(newLevel, mid.x, mid.y);
  // 保持轻微的上抛，让合并有"弹"的感觉
  Body.setVelocity(nb.body, {
    x: (a.velocity.x + b.velocity.x) * 0.25,
    y: (a.velocity.y + b.velocity.y) * 0.25 - 1.6,
  });

  score += SCORE_TABLE[level];
  updateScore();
  AudioFX.merge(newLevel);

  // 解锁提示：每一级首次合成都提示
  if (!unlocked.has(newLevel)) {
    unlocked.add(newLevel);
    if (newLevel >= 4) {
      showCG(newLevel);           // Lv5 及以上：全屏 CG
    } else {
      showUnlockBanner(newLevel); // Lv2~Lv4：小横幅
    }
  }
}

function removeBall(body) {
  const i = balls.findIndex(b => b.body === body);
  if (i >= 0) balls.splice(i, 1);
  Composite.remove(world, body);
  mergeLock.delete(body.id);
}

/* ---------- 9. 警戒线检测（带新球保护） ---------- */
function checkDanger(dt) {
  const dy = DANGER_H * (H / 600);
  const now = performance.now();
  let over = false;
  for (const b of balls) {
    // 关键修复：刚生成的球 2 秒内不参与警戒线判定
    if (now - b.body.plugin.spawnAt < SPAWN_PROTECT) continue;
    if (b.body.position.y - b.r < dy) { over = true; break; }
  }
  if (over) {
    dangerTimer += dt;
    if (dangerTimer >= DANGER_HOLD) endGame();
  } else {
    dangerTimer = Math.max(0, dangerTimer - dt * 1.6);
  }
}

/* ---------- 10. 主循环 ---------- */
let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = lastT ? t - lastT : 16;
  lastT = t;

  if (!gameOver && !paused) {
    Engine.update(engine, Math.min(dt, 33.4));
    checkDanger(dt);
  }

  // 清理真正飞出世界的球（放宽阈值，避免误删）
  for (let i = balls.length - 1; i >= 0; i--) {
    const p = balls[i].body.position;
    if (p.y > H + 600 || p.y < -1200 || isNaN(p.x)) removeBall(balls[i].body);
  }

  draw();
  drawNextPreview();
}

/* ---------- 11. 下一个预览 ---------- */
const nextCanvas = document.getElementById('nextCanvas');
const nctx = nextCanvas.getContext('2d');
function drawNextPreview() {
  const size = nextCanvas.width;
  nctx.clearRect(0, 0, size, size);
  const cfg = LEVELS[nextLevel];
  const cx = size / 2, cy = size / 2, r = size * 0.40;
  const g = nctx.createRadialGradient(cx - r * .35, cy - r * .38, r * .1, cx, cy, r);
  g.addColorStop(0, lighten(cfg.color, 45));
  g.addColorStop(1, cfg.color);
  nctx.beginPath();
  nctx.arc(cx, cy, r, 0, Math.PI * 2);
  nctx.fillStyle = g;
  nctx.fill();

  nctx.font = `800 ${Math.round(r * 0.6)}px -apple-system,"PingFang SC",sans-serif`;
  nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
  nctx.fillStyle = cfg.text;
  const nm = cfg.name.length > 4 ? cfg.name.slice(0, 2) : cfg.name;
  nctx.fillText(nm, cx, cy + 1);
}

/* ---------- 12. 掉落 ---------- */
function dropBall() {
  if (!canDrop || gameOver || paused) return;
  canDrop = false;

  const scale = W / 380;
  const cfg = LEVELS[nextLevel];
  const r = cfg.r * scale;
  const x = clamp(dropX, r + WALL, W - r - WALL);

  const ball = makeBall(nextLevel, x, r + 6);
  Body.setVelocity(ball.body, { x: 0, y: 4 });   // 初始下落速度，手感更干脆

  nextLevel = randomLevel();
  setTimeout(() => { canDrop = true; }, 300);
}

/* ---------- 13. 输入 ---------- */
function getPointerX(clientX) {
  const rect = stageEl.getBoundingClientRect();
  return clamp(clientX - rect.left, 30, W - 30);
}

let dragging = false;
stageEl.addEventListener('pointerdown', e => {
  if (!canDrop || gameOver || paused) return;
  dragging = true;
  try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
  dropX = getPointerX(e.clientX);
});
stageEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  dropX = getPointerX(e.clientX);
});
stageEl.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  dropX = getPointerX(e.clientX);
  dropBall();
});
stageEl.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !gameOver) { togglePause(); return; }
  if (gameOver || paused || !canDrop) return;
  if (e.key === 'ArrowLeft')  dropX = clamp(dropX - 18, 30, W - 30);
  if (e.key === 'ArrowRight') dropX = clamp(dropX + 18, 30, W - 30);
  if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); dropBall(); }
});

/* ---------- 14. 解锁横幅 ---------- */
const bannerEl = document.getElementById('unlockBanner');
let bannerTimer = null;
function showUnlockBanner(level) {
  const cfg = LEVELS[level];
  bannerEl.textContent = `✨ 解锁：${cfg.name}`;
  bannerEl.style.background = `linear-gradient(135deg, ${lighten(cfg.color, 20)}, ${cfg.color})`;
  bannerEl.style.color = cfg.dark ? '#3a2600' : '#fff';
  bannerEl.style.boxShadow = `0 10px 34px ${cfg.color}66, inset 0 1px 0 rgba(255,255,255,.3)`;
  bannerEl.classList.add('show');
  AudioFX.unlockSmall();
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 1400);
}

/* ---------- 15. 里程碑 CG ---------- */
const cgEl = document.getElementById('cg');
const cgBall = document.getElementById('cgBall');
const cgText = document.getElementById('cgText');
let cgTimer = null;

function showCG(level) {
  const cfg = LEVELS[level];
  paused = true;
  cgBall.textContent = cfg.name;
  cgBall.style.background = `radial-gradient(circle at 32% 28%, ${lighten(cfg.color,45)}, ${cfg.color} 60%, ${darken(cfg.color,20)})`;
  cgBall.style.color = cfg.text;
  cgBall.style.fontSize = cfg.name.length > 4 ? 'clamp(22px,5vw,34px)' : 'clamp(28px,7vw,44px)';
  cgBall.style.textShadow = '0 4px 24px rgba(0,0,0,.4)';
  cgBall.style.boxShadow = `0 0 0 8px rgba(255,255,255,.14), 0 0 90px 10px ${cfg.color}`;
  cgText.textContent = `解锁：${cfg.name}！`;
  cgEl.classList.add('show');
  AudioFX.unlock();

  clearTimeout(cgTimer);
  cgTimer = setTimeout(() => {
    cgEl.classList.remove('show');
    paused = false;
    lastT = 0;
  }, 1500);
}

/* ---------- 16. 分数 ---------- */
function updateScore() {
  document.getElementById('scoreVal').textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('dashuaibi_best', best);
    document.getElementById('bestVal').textContent = best;
  }
}

/* ---------- 17. 暂停 / 声音开关 ---------- */
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
const pauseOverlay = document.getElementById('pauseOverlay');

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  pauseOverlay.classList.toggle('show', paused);
  pauseBtn.textContent = paused ? '▶' : '⏸';
  if (!paused) lastT = 0;
}
function setPaused(v) {
  if (gameOver) return;
  paused = v;
  pauseOverlay.classList.toggle('show', v);
  pauseBtn.textContent = v ? '▶' : '⏸';
  if (!v) lastT = 0;
}

pauseBtn.addEventListener('click', e => { e.stopPropagation(); togglePause(); });
document.getElementById('resumeBtn').addEventListener('click', () => setPaused(false));

soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !soundOn);
  if (soundOn) AudioFX.init();
});

/* ---------- 18. 结束 ---------- */
function endGame() {
  if (gameOver) return;
  gameOver = true;
  paused = true;
  AudioFX.gameover();
  document.getElementById('overScore').textContent = score;
  document.getElementById('overBest').textContent = best;
  setTimeout(() => document.getElementById('over').classList.add('show'), 260);
}

/* ---------- 19. 启动/重置 ---------- */
const gameEl = document.getElementById('game');
const floatBtns = document.getElementById('floatBtns');

function startGame() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.remove('show');
  pauseOverlay.classList.remove('show');
  cgEl.classList.remove('show');
  bannerEl.classList.remove('show');
  gameEl.classList.add('show');
  floatBtns.style.display = 'flex';

  // 清空引擎
  if (engine) {
    Composite.clear(world, false, true);
    Engine.clear(engine);
  }
  balls = [];
  mergeLock.clear();
  unlocked.clear();
  score = 0;
  gameOver = false;
  paused = false;
  canDrop = true;
  dangerTimer = 0;
  dragging = false;
  pauseBtn.textContent = '⏸';

  setupWorld();
  resize();

  nextLevel = randomLevel();
  dropX = W / 2;

  updateScore();
  document.getElementById('bestVal').textContent = best;
  lastT = 0;

  AudioFX.init();

  Events.off(engine, 'collisionStart', onCollision);
  Events.on(engine, 'collisionStart', onCollision);

  if (!loop._started) { loop._started = true; requestAnimationFrame(loop); }
}

/* ---------- 20. 工具 ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- 21. 初始化画布 ---------- */
canvas = document.createElement('canvas');
canvas.style.borderRadius = '26px';
canvas.style.zIndex = '1';
ctx = canvas.getContext('2d');
stageEl.appendChild(canvas);

window.addEventListener('resize', () => { resize(); });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  pauseOverlay.classList.remove('show');
  startGame();
});

document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

document.getElementById('bestVal').textContent = best;
</script>
</body>
</html>
